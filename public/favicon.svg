<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="secondary" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="tertiary" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#262626" stroke-width="8" />
  
  <g filter="url(#glow)">
    <rect x="120" y="240" width="64" height="152" rx="16" fill="url(#secondary)" />
    <rect x="224" y="140" width="64" height="252" rx="16" fill="url(#primary)" />
    <rect x="328" y="290" width="64" height="102" rx="16" fill="url(#tertiary)" />
  </g>
  
  <!-- Subtle grid dots -->
  <circle cx="152" cy="120" r="3" fill="#404040" />
  <circle cx="256" cy="120" r="3" fill="#404040" />
  <circle cx="360" cy="120" r="3" fill="#404040" />
  <circle cx="152" cy="200" r="3" fill="#404040" />
  <circle cx="360" cy="200" r="3" fill="#404040" />
</svg>
